# Auto-merge: thin caller -> dcyfr-labs/.github reusable; native auto-merge gated
# on the 'main protection' ruleset. Patch/minor only; majors stay manual.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "ci"
    # changesets/action v2 requires @changesets/cli v3 and renamed several of
    # its inputs. Dependabot groups cannot span ecosystems, so this bump can
    # never be paired with the npm @changesets/cli bump: whichever lands first
    # breaks Release on main. That is exactly what happened across all ten
    # dcyfr-ai-* repos on 2026-08-22. Majors stay manual and must ship together
    # with the CLI bump; minor/patch updates still flow normally.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
